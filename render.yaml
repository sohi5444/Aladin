services:
  - type: web
    name: aladdin
    repo: https://github.com/sohi5444/Aladin
    branch: main
    runtime: python
    pythonVersion: "3.12"
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
